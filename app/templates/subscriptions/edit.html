{% extends "base.html" %}

{% block title %}Edit Subscription - SubTracker{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-header">

                <h4 class="mb-0">
                    <i class="fas fa-edit"></i>
                    Edit Subscription
                </h4>

            </div>


            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for(
                        'subscriptions.edit_subscription',
                        subscription_id=subscription.id
                    ) }}"
                >

                    <!-- Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Subscription Name *
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ subscription.name }}"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label class="form-label">
                            Category *
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required
                        >

                            {% for category in [
                                'OTT',
                                'Music',
                                'Gaming',
                                'Cloud Storage',
                                'Software',
                                'News',
                                'Education',
                                'Other'
                            ] %}

                            <option
                                value="{{ category }}"
                                {% if subscription.category == category %}
                                selected
                                {% endif %}
                            >
                                {{ category }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="row">

                        <!-- Monthly Cost -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Monthly Cost (₹) *
                            </label>

                            <input
                                type="number"
                                name="monthly_cost"
                                class="form-control"
                                value="{{ subscription.monthly_cost }}"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>


                        <!-- Annual Cost -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Annual Cost (₹)
                            </label>

                            <input
                                type="number"
                                name="annual_cost"
                                class="form-control"
                                value="{{ subscription.annual_cost or '' }}"
                                min="0"
                                step="0.01"
                            >

                        </div>

                    </div>


                    <div class="row">

                        <!-- Billing Cycle -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Billing Cycle *
                            </label>

                            <select
                                name="billing_cycle"
                                class="form-select"
                                required
                            >

                                {% for cycle in [
                                    'Monthly',
                                    'Quarterly',
                                    'Yearly'
                                ] %}

                                <option
                                    value="{{ cycle }}"
                                    {% if subscription.billing_cycle == cycle %}
                                    selected
                                    {% endif %}
                                >
                                    {{ cycle }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Start Date -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Start Date *
                            </label>

                            <input
                                type="date"
                                name="start_date"
                                class="form-control"
                                value="{{ subscription.start_date.strftime('%Y-%m-%d') }}"
                                required
                            >

                        </div>

                    </div>


                    <!-- Renewal Date -->
                    <div class="mb-3">

                        <label class="form-label">
                            Renewal Date
                        </label>

                        <input
                            type="date"
                            name="renewal_date"
                            class="form-control"
                            value="{% if subscription.renewal_date %}{{ subscription.renewal_date.strftime('%Y-%m-%d') }}{% endif %}"
                        >

                    </div>


                    <!-- Status -->
                    <div class="mb-3">

                        <label class="form-label">
                            Status *
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value="Active"
                                {% if subscription.status == 'Active' %}
                                selected
                                {% endif %}
                            >
                                Active
                            </option>

                            <option
                                value="Paused"
                                {% if subscription.status == 'Paused' %}
                                selected
                                {% endif %}
                            >
                                Paused
                            </option>

                            <option
                                value="Cancelled"
                                {% if subscription.status == 'Cancelled' %}
                                selected
                                {% endif %}
                            >
                                Cancelled
                            </option>

                        </select>

                    </div>


                    <!-- Notes -->
                    <div class="mb-3">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                        >{{ subscription.notes or '' }}</textarea>

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex justify-content-between">

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="fas fa-save"></i>
                                Save Changes
                            </button>

                            <a
                                href="{{ url_for('subscriptions.list_subscriptions') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>


                        <!-- Delete -->
                        <form
                            method="POST"
                            action="{{ url_for(
                                'subscriptions.delete_subscription',
                                subscription_id=subscription.id
                            ) }}"
                            onsubmit="return confirm(
                                'Are you sure you want to delete this subscription?'
                            );"
                        >

                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>

                        </form>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Admin Panel - SubTracker{% endblock %}

{% block content %}
<div class="row g-4">
    <aside class="col-lg-3">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><i class="fas fa-shield-alt me-2"></i>Admin Panel</h5>
            </div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}"><i class="fas fa-home me-2"></i>Dashboard</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint in ['admin.users', 'admin.user_detail'] %}active{% endif %}" href="{{ url_for('admin.users') }}"><i class="fas fa-users me-2"></i>Users</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint in ['admin.subscriptions', 'admin.subscription_detail'] %}active{% endif %}" href="{{ url_for('admin.subscriptions') }}"><i class="fas fa-list me-2"></i>Subscriptions</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.analytics_overview' %}active{% endif %}" href="{{ url_for('admin.analytics_overview') }}"><i class="fas fa-chart-bar me-2"></i>Overview</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.spending_analytics' %}active{% endif %}" href="{{ url_for('admin.spending_analytics') }}"><i class="fas fa-money-bill-wave me-2"></i>Spending</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.usage_analytics' %}active{% endif %}" href="{{ url_for('admin.usage_analytics') }}"><i class="fas fa-clock me-2"></i>Usage</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.value_score_analytics' %}active{% endif %}" href="{{ url_for('admin.value_score_analytics') }}"><i class="fas fa-star me-2"></i>Value Scores</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.reports' or request.endpoint == 'admin.export_report' %}active{% endif %}" href="{{ url_for('admin.reports') }}"><i class="fas fa-file-alt me-2"></i>Reports</a>
                <a class="list-group-item list-group-item-action {% if request.endpoint == 'admin.settings' %}active{% endif %}" href="{{ url_for('admin.settings') }}"><i class="fas fa-cog me-2"></i>Settings</a>
                <a class="list-group-item list-group-item-action text-danger" href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
    </aside>

    <div class="col-lg-9">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
